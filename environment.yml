name: rnencodec
channels:
  - conda-forge
channel_priority: strict
dependencies:
  # Core
  - python=3.11
  - pip
  - numpy>=1.26
  - scipy
  - matplotlib
  - seaborn

  # Jupyter
  - jupyterlab
  - ipykernel
  - ipywidgets
  - tensorboard

  # Audio libs (no conda portaudio/sounddevice here)
  - libsndfile
  - pysoundfile
  - ffmpeg
  - soxr
  - librosa
  - audioread

  # Hugging Face
  - transformers
  - accelerate
  - datasets
  - tokenizers
  - sentencepiece
  - safetensors
  - huggingface_hub

  # PyTorch trio (CPU builds from conda-forge)
  - pytorch=2.5.*
  - torchaudio=2.5.*
  - torchvision=0.20.*

  # Your packages via pip
  - pip:
      - -e .
      - rtpysynth[ui] @ git+https://github.com/lonce/RTPySynth@v0.1.4
      - sounddevice==0.5.2   # pip wheel bundles PortAudio; 24 kHz-friendly
