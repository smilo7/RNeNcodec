name: rnencodec
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip

  # Core scientific stack (compiled)
  - numpy
  - scipy
  - matplotlib

  # Notebooks / UI (compiled bits + stable)
  - jupyterlab
  - ipykernel
  - ipywidgets
  - tensorboard

  # Utilities + git
  - tqdm
  - requests
  - pyyaml
  - packaging
  - git
  - git-lfs

  # Native audio dependencies (cross-platform via conda-forge)
  - ffmpeg
  - libsndfile
  - portaudio

  - pip:
      # your package
      - -e .
      # your git dependency
      - rtpysynth[ui] @ git+https://github.com/lonce/RTPySynth@v0.1.4
      # pip deps including torch (CPU by default)
      - -r requirements-conda.txt

variables:
  PYTHONNOUSERSITE: "1"
