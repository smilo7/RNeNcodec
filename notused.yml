name: rnencodec
channels:
  - conda-forge
channel_priority: strict
dependencies:
  # Minimal conda bits
  - python=3.11
  - pip
  - numpy>=1.26
  - scipy
  - matplotlib
  - seaborn
  - jupyterlab
  - ipykernel
  - ipywidgets
  - tensorboard
  - soxr  # pure-Python wheel exists too, but conda here is fine

  # Everything else via pip (keeps audio identical to your working env)
  - pip:
      - -e .

      # audio stack (PyPI wheels)
      - sounddevice==0.5.2
      - soundfile==0.13.1
      - audioread==3.0.1
      - librosa==0.11.0

      # handy, no-system ffmpeg binary (downloaded per-user on first use)
      - imageio==2.*           # for video/audio IO convenience
      - imageio-ffmpeg==0.*    # ships ffmpeg binary for Python use

      # Hugging Face stack
      - transformers
      - accelerate
      - datasets
      - tokenizers
      - sentencepiece
      - safetensors
      - huggingface_hub

      # realtime synth
      - rtpysynth[ui] @ git+https://github.com/lonce/RTPySynth@v0.1.4
